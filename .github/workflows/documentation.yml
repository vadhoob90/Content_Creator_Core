name: Documentation checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "tests/test_documentation_commands.py"
      - ".github/workflows/documentation.yml"
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "tests/test_documentation_commands.py"
      - ".github/workflows/documentation.yml"

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_documentation_commands.py tests/test_repository.py

# Content under content/**, publication-triggered learning files, and
# perspective proposal queues are intentionally excluded so ordinary writing
# work does not start CI.
