name: Documentation checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "tests/test_documentation_commands.py"
      - ".github/workflows/documentation.yml"
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "tests/test_documentation_commands.py"
      - ".github/workflows/documentation.yml"

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_documentation_commands.py tests/test_repository.py

# Content under content/**, publication-triggered learning files, and
# perspective proposal queues are intentionally excluded so ordinary writing
# work does not start CI.
