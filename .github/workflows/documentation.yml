name: Documentation checks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_documentation_commands.py tests/test_repository.py

# Content under content/**, publication-triggered learning files, and
# perspective proposal queues are intentionally excluded so ordinary writing
# work does not start CI.
