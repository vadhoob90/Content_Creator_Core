name: Live provider evaluation

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to evaluate
        required: true
        type: choice
        options:
          - anthropic
          - bedrock
          - openai

jobs:
  live-eval:
    runs-on: ubuntu-latest
    environment: live-model-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[providers]"
      - name: Verify provider credentials and adapter import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ "$PROVIDER" = "bedrock" ]; then
            python -c "import os; assert os.getenv('AWS_REGION'); assert os.getenv('AWS_BEARER_TOKEN_BEDROCK') or (os.getenv('AWS_ACCESS_KEY_ID') and os.getenv('AWS_SECRET_ACCESS_KEY'))"
            python -c "from content_creator.providers.registry import ProviderRegistry; ProviderRegistry().get('bedrock').verify()"
          else
            python -c "import os; assert os.getenv(('OPENAI' if os.environ['PROVIDER'] == 'openai' else 'ANTHROPIC') + '_API_KEY')"
          fi
          python -c "from content_creator.providers.registry import ProviderRegistry; import os; ProviderRegistry().get(os.environ['PROVIDER'])"
      - name: Run bounded flagship evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: content-creator eval --mode live --providers "$PROVIDER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        if: always()
        with:
          name: live-provider-evaluation
          path: |
            .eval-results/
            runs/
