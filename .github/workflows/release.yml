name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    if: github.repository == 'vadhoob90/Content_Creator_Core'
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.11"
          enable-cache: true
      - name: Verify and install the locked build environment
        run: |
          uv lock --check
          uv sync --frozen --all-extras
      - name: Verify the release commit is on main
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main
      - name: Verify tag matches package version
        run: |
          package_version="$(uv run --frozen --all-extras python -c 'from pathlib import Path; scope = {}; exec(Path("src/content_creator/version.py").read_text(), scope); print(scope["VERSION"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
      - name: Build wheel and source distribution
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv run --frozen --all-extras python -m build --no-isolation
          uv run --frozen --all-extras python -m build \
            --no-isolation \
            --outdir dist-rebuild
          uv run --frozen --all-extras python scripts/normalize_sdist.py \
            dist/*.tar.gz \
            dist-rebuild/*.tar.gz
          for artifact in dist/*; do
            cmp "${artifact}" "dist-rebuild/$(basename "${artifact}")"
          done
          uv run --frozen --all-extras python -m twine check dist/*
      - name: Validate package resources and metadata
        run: |
          mkdir -p release
          uv run --frozen --all-extras python scripts/validate_distribution.py \
            dist \
            --expected-version "${PACKAGE_VERSION}" \
            | tee release/manifest.json
          sha256sum dist/* > release/SHA256SUMS
      - name: Generate a CycloneDX software bill of materials
        run: |
          uv run --frozen --all-extras python -m pip_audit \
            --local \
            --progress-spinner=off \
            --format cyclonedx-json \
            --output release/sbom.cdx.json
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv /tmp/content-creator-release-test
          /tmp/content-creator-release-test/bin/python -m pip install \
            --disable-pip-version-check \
            dist/content_creator-"${PACKAGE_VERSION}"-py3-none-any.whl \
            pytest
          /tmp/content-creator-release-test/bin/python -c \
            'import content_creator; print(content_creator.__version__)'
          /tmp/content-creator-release-test/bin/content-creator --help
          /tmp/content-creator-release-test/bin/content-creator workspace create \
            /tmp/content-creator-author \
            --author-name "Release Validation" \
            --core-ref "${GITHUB_REF_NAME}"
          /tmp/content-creator-release-test/bin/content-creator \
            --workspace /tmp/content-creator-author doctor
          /tmp/content-creator-release-test/bin/pytest \
            /tmp/content-creator-author/tests
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            release/SHA256SUMS
            release/manifest.json
            release/sbom.cdx.json
      - name: Attest the distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: release/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: |
            dist/
            release/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/content-creator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            release/SHA256SUMS \
            release/manifest.json \
            release/sbom.cdx.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Content Creator ${GITHUB_REF_NAME}"
