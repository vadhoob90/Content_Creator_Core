name: Offline checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=content_creator --cov-report=term-missing
      - run: content-creator eval
