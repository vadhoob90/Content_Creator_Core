name: Offline checks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - name: Verify and install the locked environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev
      - name: Enforce lint, exception, and argument rules
        run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev mypy
      - name: Enforce Google Style documentation contracts
        run: uv run --frozen --extra dev python scripts/documentation_report.py --check
      - name: Enforce architecture and readability limits
        run: |
          uv run --frozen --extra dev python scripts/architecture_report.py --check
          uv run --frozen --extra dev python scripts/readability_report.py --check
      - name: Measure the enforcement harness
        run: |
          uv run --frozen --extra dev coverage run \
            --source=scripts \
            --data-file=.coverage-harness \
            -m pytest \
            tests/test_guardrail_harness.py \
            tests/test_distribution_harness.py \
            tests/test_documentation_report.py \
            tests/test_release_reproducibility.py
          uv run --frozen --extra dev coverage report \
            --data-file=.coverage-harness \
            --fail-under=75 \
            --show-missing
      - name: Reject malformed patches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git diff --check "${BASE_SHA}...${GITHUB_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = push ] && \
               [ -n "${BEFORE_SHA}" ] && \
               [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BEFORE_SHA}...${GITHUB_SHA}"
          else
            git diff --check "${GITHUB_SHA}^...${GITHUB_SHA}"
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest --cov=content_creator --cov-report=term-missing

  evaluation:
    name: Offline evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev content-creator eval

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  dependency-audit:
    name: Dependency vulnerability audit Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen --all-extras python -m pip_audit --local --progress-spinner=off

  required:
    name: Required checks
    if: always()
    needs: [quality, test, evaluation, dependency-review, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          EVALUATION: ${{ needs.evaluation.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          test "${QUALITY}" = success
          test "${TEST}" = success
          test "${EVALUATION}" = success
          test "${DEPENDENCY_AUDIT}" = success
          test "${DEPENDENCY_REVIEW}" = success || test "${DEPENDENCY_REVIEW}" = skipped
