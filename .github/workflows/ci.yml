name: Offline checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=content_creator --cov-report=term-missing
      - run: content-creator eval
