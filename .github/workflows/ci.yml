name: Offline checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "agents/**"
      - "packs/**"
      - "profiles/**"
      - "!profiles/*/learnings/**"
      - "!profiles/*/perspectives/*/proposals/**"
      - "rubrics/**"
      - "config/**"
      - ".agents/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=content_creator --cov-report=term-missing
      - run: content-creator eval
