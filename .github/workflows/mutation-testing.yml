name: Advisory mutation testing

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  critical-modules:
    name: Critical-module mutation baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run advisory mutations
        run: uv run --frozen --extra dev mutmut run
      - name: Export mutation statistics
        if: always()
        run: uv run --frozen --extra dev mutmut export-cicd-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-testing-critical-modules
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
