name: Advisory mutation testing

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Select mutation scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.policy.outputs.required }}
      patterns: ${{ steps.policy.outputs.patterns }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Determine changed files
        run: git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > "$RUNNER_TEMP/changed-files.txt"
      - id: policy
        name: Validate decisions and build mutation plan
        run: >-
          uv run --frozen --extra dev python scripts/mutation_policy.py
          --changed-files "$RUNNER_TEMP/changed-files.txt"
          --event "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

  targeted:
    if: github.event_name == 'pull_request' && needs.plan.outputs.required == 'true'
    needs: plan
    name: Targeted PR mutations (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run selected mutants
        env:
          MUTATION_PATTERNS: ${{ needs.plan.outputs.patterns }}
        run: |
          mapfile -t patterns <<< "$MUTATION_PATTERNS"
          uv run --frozen --extra dev mutmut run "${patterns[@]}"
      - name: Export mutation statistics
        if: always()
        run: uv run --frozen --extra dev mutmut export-cicd-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-testing-targeted
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn

  critical-modules:
    if: github.event_name != 'pull_request'
    name: Critical-module mutation baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run advisory mutations
        run: uv run --frozen --extra dev mutmut run
      - name: Export mutation statistics
        if: always()
        run: uv run --frozen --extra dev mutmut export-cicd-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-testing-critical-modules
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
