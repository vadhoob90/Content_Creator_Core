defaults:
  provider:
  max_output_tokens: 6000

providers:
  openai:
    profiles:
      fast:
        candidates:
          - model: gpt-5.6-luna
            reasoning_effort: low
            capabilities: [structured_output]
      balanced:
        candidates:
          - model: gpt-5.6-terra
            reasoning_effort: medium
            capabilities: [structured_output, web_search]
      deep:
        candidates:
          - model: gpt-5.6-sol
            reasoning_effort: high
            capabilities: [structured_output, web_search]
  anthropic:
    profiles:
      fast:
        candidates:
          - model: claude-haiku-4-5-20251001
            capabilities: [structured_output]
      balanced:
        candidates:
          - model: claude-sonnet-5
            capabilities: [structured_output, web_search]
      deep:
        candidates:
          - model: claude-opus-5
            capabilities: [structured_output, web_search]
  codex-native:
    profiles:
      fast:
        candidates:
          - model: gpt-5.6-luna
            reasoning_effort: low
            capabilities: [structured_output]
      balanced:
        candidates:
          - model: gpt-5.6-terra
            reasoning_effort: medium
            capabilities: [structured_output, web_search]
      deep:
        candidates:
          - model: gpt-5.6-sol
            reasoning_effort: high
            capabilities: [structured_output, web_search]
  claude-native:
    profiles:
      fast:
        candidates:
          - model: haiku
            reasoning_effort: low
            capabilities: [structured_output]
      balanced:
        candidates:
          - model: sonnet
            reasoning_effort: medium
            capabilities: [structured_output, web_search]
      deep:
        candidates:
          - model: opus
            reasoning_effort: high
            capabilities: [structured_output, web_search]

roles:
  briefing-agent: fast
  researcher-light: balanced
  researcher-deep: deep
  writer-post: balanced
  writer-article: deep
  writer-text: balanced
  critic-post: balanced
  critic-article: deep
  critic-text: balanced
  learning-extractor: fast
  attribution-reviewer: fast
  voice-analyst: deep
  profile-critic: balanced
  voice-evaluator: deep
  perspective-extractor: balanced
