[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creator"
version = "1.4.1"
description = "Provider-neutral content creation and voice workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md", "NOTICE"]
authors = [{ name = "Bharath Vadhoola" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
]

[project.urls]
Homepage = "https://github.com/vadhoob90/Content_Creator_Core"
Repository = "https://github.com/vadhoob90/Content_Creator_Core"
Issues = "https://github.com/vadhoob90/Content_Creator_Core/issues"
Changelog = "https://github.com/vadhoob90/Content_Creator_Core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=2.48,<3"]
anthropic = ["anthropic>=0.120,<1"]
providers = ["openai>=2.48,<3", "anthropic>=0.120,<1"]
ml = [
  "scikit-learn>=1.9,<2",
]
dev = [
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9",
  "scikit-learn>=1.9,<2",
]

[project.scripts]
content-creator = "content_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"content_creator.resources" = [
  "agent-templates/standard/agents/*.md",
  "agent-templates/standard/agents/*.json",
  "config/*.yaml",
  "contracts/*.md",
  "contracts/roles/*.md",
  "evals/cases/*.yaml",
  "packs/*/*.json",
  "packs/*/*.yaml",
  "profiles/default/*.md",
  "profiles/default/learnings/*.json",
  "profiles/starter/*.md",
  "rubrics/*.yaml",
  "skills/*/*.md",
  "skills/*/agents/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["content_creator"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
files = ["src/content_creator"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "D",
  "ARG001",
  "ARG002",
  "S110",
  "S112",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR1702",
]
preview = true
ignore = [
  "UP006",
  "UP007",
  "UP032",
  "UP035",
  "UP042",
  "UP045",
  # Google convention treats properties as noun phrases; Core requires every
  # definition summary to begin with an active imperative verb.
  "D421",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 50
max-nested-blocks = 4
