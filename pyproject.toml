[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creator"
version = "0.4.0"
description = "Provider-neutral content creation and voice workflow"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md", "NOTICE"]
authors = [{ name = "Bharath Vadhoola" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
openai = ["openai>=2.48,<3"]
anthropic = ["anthropic>=0.120,<1"]
providers = ["openai>=2.48,<3", "anthropic>=0.120,<1"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9",
]

[project.scripts]
content-creator = "content_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"content_creator.resources" = [
  "agent-templates/standard/agents/*.md",
  "agent-templates/standard/agents/*.json",
  "config/*.yaml",
  "contracts/*.md",
  "contracts/roles/*.md",
  "evals/cases/*.yaml",
  "packs/*/*.json",
  "packs/*/*.yaml",
  "profiles/default/*.md",
  "profiles/default/learnings/*.json",
  "profiles/starter/*.md",
  "rubrics/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "UP006",
  "UP007",
  "UP032",
  "UP035",
  "UP045",
]
