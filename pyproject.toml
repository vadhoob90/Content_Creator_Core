[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creator"
version = "0.12.1"
description = "Provider-neutral content creation and voice workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md", "NOTICE"]
authors = [{ name = "Bharath Vadhoola" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
]

[project.urls]
Homepage = "https://github.com/vadhoob90/Content_Creator_Core"
Repository = "https://github.com/vadhoob90/Content_Creator_Core"
Issues = "https://github.com/vadhoob90/Content_Creator_Core/issues"
Changelog = "https://github.com/vadhoob90/Content_Creator_Core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=2.48,<3"]
anthropic = ["anthropic>=0.120,<1"]
providers = ["openai>=2.48,<3", "anthropic>=0.120,<1"]
ml = [
  "scikit-learn>=1.9,<2",
]
dev = [
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9",
  "scikit-learn>=1.9,<2",
]

[project.scripts]
content-creator = "content_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"content_creator.resources" = [
  "agent-templates/standard/agents/*.md",
  "agent-templates/standard/agents/*.json",
  "config/*.yaml",
  "contracts/*.md",
  "contracts/roles/*.md",
  "evals/cases/*.yaml",
  "packs/*/*.json",
  "packs/*/*.yaml",
  "profiles/default/*.md",
  "profiles/default/learnings/*.json",
  "profiles/starter/*.md",
  "rubrics/*.yaml",
  "skills/*/*.md",
  "skills/*/agents/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["content_creator"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
files = [
  "src/content_creator/diagnostics.py",
  "src/content_creator/domain.py",
  "src/content_creator/packs.py",
  "src/content_creator/providers/base.py",
  "src/content_creator/resource_paths.py",
  "src/content_creator/routing.py",
  "src/content_creator/upgrade.py",
  "src/content_creator/visuals.py",
  "src/content_creator/workspace.py",
]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "UP006",
  "UP007",
  "UP032",
  "UP035",
  "UP042",
  "UP045",
]
